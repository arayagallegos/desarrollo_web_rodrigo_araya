{% extends 'base.html' %}
{% block title %}Estadísticas{% endblock %}
{% block content %}
<h1>Estadísticas</h1>

<section>
  <h2>Actividades por Día</h2>
  <div id="grafico-lineas" style="height: 400px;"></div>
</section>
<section>
  <h2>Actividades por Tipo</h2>
  <div id="grafico-torta" style="height: 400px;"></div>
</section>
<section>
  <h2>Actividades por Horario (por mes)</h2>
  <div id="grafico-barras" style="height: 400px;"></div>
</section>

<p><a href="{{ url_for('portada') }}">&larr; Volver a la portada</a></p>

<script src="https://code.highcharts.com/highcharts.js"></script>
<script src="{{ url_for('static', filename='js/estadisticas.js') }}"></script>
{% endblock %}
